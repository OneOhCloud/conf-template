name: Validate templates

on:
  push:
    branches: [stable, beta, dev]
    paths:
      - 'conf/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/validate-templates.yml'
  pull_request:
    branches: [stable, beta, dev]
    paths:
      - 'conf/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/validate-templates.yml'
  workflow_dispatch:

# What this workflow guards against:
#   1. Someone hand-edits `conf/1.13/` or `conf/1.12/` instead of the canonical
#      `conf/1.13.8/` — the drift check fails because `pnpm generate` would
#      overwrite their manual edits from the canonical source.
#   2. Someone edits the canonical `conf/1.13.8/` but forgets to run
#      `pnpm generate` locally — derived versions stay stale. Drift check
#      catches it.
#   3. Someone edits the canonical in a way that produces an invalid config
#      (broken rule_set references, forbidden legacy fields in 1.13.8, etc.)
#      — the static validator in `scripts/generate.ts` catches it.
#   4. Someone edits the canonical in a way the sing-box parser rejects
#      (bad DNS server type, unknown route action, etc.) — `sing-box check`
#      catches it.
#
# Version pins: legacy buckets are checked with 1.13.8; the 1.14 bucket is
# checked with the exact prerelease it targets. `scripts/generate.ts` resolves
# the per-bucket override before the legacy fallback binary.

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download sing-box validator binaries
        run: |
          set -euo pipefail
          LEGACY_VERSION="1.13.8"
          BETA_VERSION="1.14.0-beta.10"
          CURL_ARGS=(--fail --show-error --location --connect-timeout 15 --max-time 300)

          curl "${CURL_ARGS[@]}" -o sing-box-legacy.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${LEGACY_VERSION}/sing-box-${LEGACY_VERSION}-linux-amd64.tar.gz"
          tar xzf sing-box-legacy.tar.gz
          mv "sing-box-${LEGACY_VERSION}-linux-amd64/sing-box" ./sing-box-legacy

          curl "${CURL_ARGS[@]}" -o sing-box-beta.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${BETA_VERSION}/sing-box-${BETA_VERSION}-linux-amd64.tar.gz"
          tar xzf sing-box-beta.tar.gz
          mv "sing-box-${BETA_VERSION}-linux-amd64/sing-box" ./sing-box-beta

          chmod +x ./sing-box-legacy ./sing-box-beta
          ./sing-box-legacy version
          ./sing-box-beta version

      - name: Run generator with strict validation
        env:
          SING_BOX_BIN: ${{ github.workspace }}/sing-box-legacy
          SING_BOX_BIN_1_14: ${{ github.workspace }}/sing-box-beta
        run: |
          pnpm test
          pnpm generate:strict

      - name: Verify no drift from canonical source
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo ""
            echo "::error::Generated files are out of sync with their versioned generators."
            echo "Someone either:"
            echo "  (a) hand-edited a generated file under conf/** — don't."
            echo "  (b) edited a generator or intent and forgot to run 'pnpm generate' locally."
            echo "  (c) modified scripts/generate.ts and didn't commit the re-generated output."
            echo ""
            echo "Fix: run 'pnpm generate' in a local clone and commit the diff."
            exit 1
          fi
          echo "✓ no drift — canonical and derived files are in sync"
